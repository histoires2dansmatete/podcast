name: Vérification du site

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Vérifier l'installation
        run: npm ci

      - name: Tests unitaires, sécurité, XML, régression et construction complète
        run: npm test

      - name: Vérifier les fichiers destinés à Cloudflare
        run: |
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/_redirects
          test -f dist/404.html
          test -f dist/assets/main.js
          test -f dist/assets/logo.webp
          test -f dist/histoires.html
          test -f dist/qui-suis-je.html
          test -f dist/data/histoires.json
          # Les pages de podcasts sont publiques dans la V3.
          test -f dist/ecouter.html
          test -f dist/histoires/bas-les-masques/index.html

      - name: Vérifier le sitemap et les Functions
        run: |
          test -f dist/sitemap.xml
          test -f dist/_routes.json
          test -f functions/admin/index.js
          test -f functions/api/admin/stats.js
          test -f functions/api/track.js
          test -f functions/_middleware.js
          test -f functions/api/admin/stories.js
          test -f tests/fixtures/histoires-wordpress-public.xml
